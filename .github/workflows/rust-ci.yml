name: Rust CI

on:
  push:
    branches: ["main", "phase-4-5-agent-editorial"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    name: Format and compile workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile all crates and targets
        run: cargo check --workspace --all-targets
